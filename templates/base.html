<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GymTracker{% endblock %}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    --border: #2e2e2e;
    --text: #e8e8e8;
    --muted: #888;
    --accent: #4f8ef7;
    --accent-dim: #1a2e54;
    --green: #3ecf72;
    --green-dim: #0e2d1c;
    --red: #f76060;
    --red-dim: #2d0e0e;
    --amber: #f5a623;
    --radius: 8px;
    --radius-lg: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; align-items: center; justify-content: space-between; height: 52px; position: sticky; top: 0; z-index: 10; }
  .nav-brand { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -0.3px; }
  .nav-brand span { color: var(--accent); }
  .nav-actions { display: flex; gap: 8px; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text); transition: background 0.15s; text-decoration: none; }
  .btn:hover { background: #2e2e2e; text-decoration: none; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3a7de8; }
  .btn-danger { background: var(--red-dim); border-color: var(--red); color: var(--red); }
  .btn-danger:hover { background: #3d1212; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .container { max-width: 760px; margin: 0 auto; padding: 28px 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 14px; }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
  .label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .badge-push { background: #2d1a0e; color: var(--amber); }
  .badge-pull { background: var(--green-dim); color: var(--green); }
  .badge-legs { background: var(--accent-dim); color: var(--accent); }
  .badge-full { background: #1f1030; color: #b07ef5; }
  .badge-other { background: var(--surface2); color: var(--muted); }
  input, textarea, select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius); padding: 8px 12px; font-size: 14px; font-family: inherit; width: 100%; transition: border-color 0.15s; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row-3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
  .empty { text-align: center; padding: 48px 20px; color: var(--muted); }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 4px; background: var(--surface2); color: var(--muted); margin-right: 4px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .text-muted { color: var(--muted); }
  .text-green { color: var(--green); }
  .text-accent { color: var(--accent); }
  .flex { display: flex; align-items: center; }
  .gap-8 { gap: 8px; }
  .mt-4 { margin-top: 4px; }
  .mt-12 { margin-top: 12px; }
  .mb-4 { margin-bottom: 4px; }
  @media (max-width: 520px) {
    .form-row, .form-row-3 { grid-template-columns: 1fr; }
    .container { padding: 20px 14px; }
  }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav class="nav">
  <a class="nav-brand" href="/">⚡ <span>Gym</span>Tracker</a>
  <div class="nav-actions">
    <a class="btn btn-primary btn-sm" href="/session/new">+ New session</a>
  </div>
</nav>
<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>
