{% extends "base.html" %}
{% block title %}New session{% endblock %}
{% block content %}
<div style="max-width:480px">
  <div style="margin-bottom:24px">
    <a href="/" class="text-muted" style="font-size:13px">← Back</a>
    <h1 style="font-size:20px;font-weight:600;margin-top:8px;letter-spacing:-0.4px">New session</h1>
  </div>
  <div class="card">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input type="date" name="session_date" value="{{ today }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Session label</label>
        <select name="label">
          <option value="Push day">Push day</option>
          <option value="Pull day">Pull day</option>
          <option value="Leg day">Leg day</option>
          <option value="Full body">Full body</option>
          <option value="Cardio">Cardio</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Notes (optional)</label>
        <textarea name="notes" rows="2" placeholder="e.g. felt strong today, increased bench weight"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center">Start session →</button>
    </form>
  </div>
</div>
{% endblock %}
